<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlayn Akademiya — LMS</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135768.png" type="image/x-icon">
    <meta name="theme-color" content="#6366f1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ===== ZAXIRA XOTIRA ===== -->
    <script>
        function lsGet(k){ try { return JSON.parse(localStorage.getItem('lms_'+k)); } catch(e){ return null; } }
        window.courses  = lsGet('courses') || [];
        window.users    = lsGet('users') || {};
        window.config   = Object.assign({ adminUser:'admin', adminPass:'123', academyName:'Onlayn Akademiya' }, lsGet('config')||{});
        window.currentUser = null;   // {id, name, role}
        window.cloudStatus = 'yuklanmoqda';

        window.saveLocal = function(){
            try {
                localStorage.setItem('lms_courses', JSON.stringify(window.courses||[]));
                localStorage.setItem('lms_users', JSON.stringify(window.users||{}));
                localStorage.setItem('lms_config', JSON.stringify(window.config||{}));
            } catch(e){}
        };
        window.saveLocal();
        window.saveCourses   = window.saveCourses   || function(){ window.saveLocal(); };
        window.saveUsers     = window.saveUsers     || function(){ window.saveLocal(); };
        window.saveConfigLMS = window.saveConfigLMS || function(){ window.saveLocal(); };
    </script>

    <!-- ===== FIREBASE ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyDWL--54HpVLoyjsT_QOZcFoSNsawjQfHg",
            authDomain: "maktab-buxgalteriya.firebaseapp.com",
            databaseURL: "https://maktab-buxgalteriya-default-rtdb.firebaseio.com",
            projectId: "maktab-buxgalteriya",
            storageBucket: "maktab-buxgalteriya.firebasestorage.app",
            messagingSenderId: "1005121978052",
            appId: "1:1005121978052:web:5ab340f9d8c40705dbd391"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bor = v => v && Object.keys(v).length > 0;
        function lsGet(k){ try { return JSON.parse(localStorage.getItem('lms_'+k)); } catch(e){ return null; } }

        onValue(ref(db, 'lms/courses'), (s) => {
            const cloud = s.val();
            if (bor(cloud)) window.courses = cloud;
            else {
                const local = lsGet('courses');
                if (local && local.length) { window.courses = local; set(ref(db,'lms/courses'), local).catch(()=>{}); }
            }
            window.cloudStatus = 'ulandi';
            if (typeof updateSync === 'function') updateSync();
            if (typeof renderCurrent === 'function') renderCurrent();
        });
        onValue(ref(db, 'lms/users'), (s) => {
            const cloud = s.val();
            if (bor(cloud)) window.users = cloud;
            else {
                const local = lsGet('users');
                if (bor(local)) { window.users = local; set(ref(db,'lms/users'), local).catch(()=>{}); }
            }
            if (typeof renderCurrent === 'function') renderCurrent();
        });
        onValue(ref(db, 'lms/config'), (s) => {
            const v = s.val();
            if (v && v.adminUser) window.config = v;
        });

        let xatoBor = false;
        function xatoToast(){
            if (xatoBor) return; xatoBor = true;
            if (typeof toast === 'function')
                toast("ℹ️ Bulutga ulanmadi — ma'lumotlar shu qurilmada saqlanadi.", 'warn');
        }
        window.saveCourses = () => { window.saveLocal();
            set(ref(db,'lms/courses'), window.courses).catch(xatoToast); };
        window.saveUsers = () => { window.saveLocal();
            set(ref(db,'lms/users'), window.users).catch(xatoToast); };
        window.saveConfigLMS = () => { window.saveLocal();
            set(ref(db,'lms/config'), window.config).catch(xatoToast); };
    </script>

    <style>
        :root { --bg:#f8fafc; --card:#fff; --primary:#6366f1; --text:#1e293b; --sub:#64748b;
                --border:#e2e8f0; --success:#10b981; --danger:#ef4444; --warn:#f59e0b; }
        .dark-mode { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
        * { box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; transition:.3s; }
        #auth-overlay { position:fixed; inset:0; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:9999; }
        .card { background:var(--card); padding:30px; border-radius:24px; box-shadow:0 10px 25px rgba(0,0,0,.08); width:100%; max-width:400px; border:1px solid var(--border); }
        input, select, textarea { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:12px; width:100%; margin-bottom:12px; outline:none; font-family:inherit; }
        input:focus, select:focus { border-color:var(--primary); }
        .btn { padding:10px 16px; border-radius:12px; border:none; font-weight:600; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-family:inherit; white-space:nowrap; }
        .btn:hover { transform:translateY(-2px); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-outline { background:var(--card); border:1px solid var(--border); color:var(--text); }
        .btn-success { background:var(--success); color:#fff; }
        .btn-danger { background:var(--danger); color:#fff; }
        .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .tab-btn { padding:11px 16px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
        .course-card { background:var(--card); border:1px solid var(--border); border-radius:20px; overflow:hidden; transition:.2s; cursor:pointer; }
        .course-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.1); }
        .course-cover { height:130px; display:flex; align-items:center; justify-content:center; font-size:48px; color:#fff; }
        .course-body { padding:16px; }
        .course-body h3 { margin:0 0 6px; font-size:16px; }
        .course-body p { margin:0 0 10px; font-size:12px; color:var(--sub); }
        .price-tag { font-weight:800; color:var(--primary); font-size:15px; }
        .lesson-row { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin-bottom:8px; }
        .lesson-row.done { border-color:var(--success); }
        .quiz-opt { display:block; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer; font-family:inherit; font-size:14px; text-align:left; width:100%; }
        .quiz-opt:hover { border-color:var(--primary); }
        .quiz-opt.correct { background:#d1fae5; border-color:var(--success); color:#065f46; }
        .quiz-opt.wrong { background:#fee2e2; border-color:var(--danger); color:#991b1b; }
        .progress-bar { background:var(--bg); border-radius:10px; height:10px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--primary); transition:.4s; }
        .chip { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12px; color:var(--sub); font-weight:700; }
        .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
        .stat-card { background:var(--card); padding:16px 20px; border-radius:18px; border:1px solid var(--border); }
        .stat-card span { font-size:12px; color:var(--sub); font-weight:600; }
        .stat-card h2 { margin:6px 0 0; font-size:22px; }
        .toast { position:fixed; bottom:25px; right:25px; padding:14px 22px; border-radius:14px; color:#fff; font-weight:600; font-size:13px; z-index:10000; animation:pop .3s; box-shadow:0 8px 20px rgba(0,0,0,.2); max-width:420px; }
        .toast.ok { background:var(--success); } .toast.err { background:var(--danger); } .toast.warn { background:var(--warn); }
        @keyframes pop { from { transform:translateY(20px); opacity:0; } }
        .video-wrap { position:relative; padding-bottom:56.25%; height:0; border-radius:16px; overflow:hidden; margin-bottom:16px; }
        .video-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        .admin-only { display:none !important; }
        body.role-admin .admin-only { display:inline-flex !important; }
        #sync { font-size:12px; color:var(--sub); font-weight:600; }
        table { width:100%; border-collapse:separate; border-spacing:0 8px; }
        th { text-align:left; padding:8px; font-size:11px; color:var(--sub); text-transform:uppercase; }
        td { padding:6px 10px; }
        tr.group-row td { background:var(--bg); font-weight:800; border-radius:10px; font-size:13px; }
    </style>
</head>
<body>

    <!-- ===== RO'YXATDAN O'TISH / KIRISH ===== -->
    <div id="auth-overlay">
        <div class="card" style="text-align:center;">
            <div style="font-size:48px;">🎓</div>
            <h2 style="margin:8px 0 4px;">Onlayn Akademiya</h2>
            <p style="color:var(--sub); font-size:13px; margin:0 0 18px;">Har qanday joydan o'qing!</p>

            <div id="login-form">
                <input type="text" id="auth-name" placeholder="Ismingiz (yangi akkaunt uchun)">
                <input type="tel" id="auth-phone" placeholder="Telefon: +998...">
                <input type="password" id="auth-pass" placeholder="Parol (kamida 4 belgi)">
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="register()">🚀 Ro'yxatdan o'tish</button>
                <button class="btn" style="background:none; color:var(--primary); font-size:13px; margin-top:6px;" onclick="toggleLogin()">✅ Akkauntim bor — kirish</button>
            </div>

            <div id="login-exist" style="display:none;">
                <input type="tel" id="log-phone" placeholder="Telefon: +998...">
                <input type="password" id="log-pass" placeholder="Parol">
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="login()">Kirish</button>
                <button class="btn" style="background:none; color:var(--primary); font-size:13px; margin-top:6px;" onclick="toggleLogin()">➕ Yangi akkaunt yaratish</button>
            </div>

            <button class="btn" style="background:none; color:var(--sub); font-size:12px; margin-top:14px;" onclick="adminLogin()">🔐 Admin</button>
        </div>
    </div>

    <!-- ===== ASOSIY QISM ===== -->
    <div id="main-content" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
            <h1 style="margin:0;">🎓 <span id="acad-title">Onlayn Akademiya</span></h1>
            <span id="sync">☁️ Ulanmoqda...</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <span class="chip">👤 <span id="who"></span></span>
                <button class="btn btn-outline" onclick="toggleDark()" id="dark-toggle">🌙</button>
                <button class="btn btn-outline" onclick="logout()">Chiqish</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tb-kurslar" onclick="switchTab('kurslar')">📚 Kurslar</button>
            <button class="tab-btn" id="tb-mening" onclick="switchTab('mening')">🎓 Mening kurslarim</button>
            <button class="tab-btn admin-only" id="tb-boshqaruv" onclick="switchTab('boshqaruv')">⚙️ Boshqaruv</button>
            <button class="tab-btn admin-only" id="tb-ustozlar" onclick="switchTab('ustozlar')">👨‍🏫 Ustozlar paneli</button>
        </div>

        <!-- KURSLAR KATALOGI -->
        <div id="tab-kurslar" class="tab-page">
            <div id="catalog" class="grid"></div>
        </div>

        <!-- MENING KURSLARIM -->
        <div id="tab-mening" class="tab-page" style="display:none;">
            <div id="my-courses" class="grid"></div>
        </div>

        <!-- BOSHQARUV (ADMIN) -->
        <div id="tab-boshqaruv" class="tab-page" style="display:none;">
            <div class="stat-grid">
                <div class="stat-card"><span>📚 Kurslar</span><h2 id="st-courses" style="color:var(--primary)">0</h2></div>
                <div class="stat-card"><span>👥 O'quvchilar</span><h2 id="st-users">0</h2></div>
                <div class="stat-card"><span>💰 Umumiy tushum</span><h2 id="st-revenue" style="color:var(--success)">0</h2></div>
            </div>
            <div class="card" style="max-width:100%; margin-bottom:20px;">
                <h3 style="margin-top:0;">➕ Yangi kurs qo'shish</h3>
                <input id="c-title" placeholder="Kurs nomi (masalan: Matematika — kasrlar)">
                <input id="c-desc" placeholder="Qisqa tavsif">
                <input id="c-price" type="number" placeholder="Narx (so'm). 0 = bepul">
                <input id="c-emoji" placeholder="Emoji belgi (masalan: 📐)" value="📐">
                <input id="c-color" type="color" value="#6366f1" style="height:48px; padding:4px;">
                <button class="btn btn-primary" onclick="addCourse()">Qo'shish</button>
            </div>
            <div class="card" style="max-width:100%; margin-bottom:20px;">
                <h3 style="margin-top:0;">⚙️ Sozlamalar</h3>
                <input id="conf-name" placeholder="Akademiya nomi">
                <button class="btn btn-primary" onclick="saveConf()">Saqlash</button>
            </div>
        </div>

        <!-- USTOZLAR PANELI (ADMIN ICHIDA) -->
        <div id="tab-ustozlar" class="tab-page" style="display:none;">
            <div class="card" style="max-width:100%; margin-bottom:20px;">
                <h3 style="margin-top:0;">➕ Yangi dars qo'shish</h3>
                <select id="lesson-course" style="margin-bottom:12px;"></select>
                <input id="l-title" placeholder="Dars nomi (masalan: 1-dars. Kasrlar tushunchasi)">
                <input id="l-video" placeholder="YouTube havolasi (masalan: https://youtu.be/xxxx)">
                <textarea id="l-desc" rows="2" placeholder="Dars haqida qisqacha (ixtiyoriy)"></textarea>
                <button class="btn btn-primary" onclick="addLesson()">Darsni qo'shish</button>
            </div>
            <div class="card" style="max-width:100%;">
                <h3 style="margin-top:0;">➕ Test savoli qo'shish</h3>
                <select id="quiz-course" style="margin-bottom:12px;"></select>
                <input id="q-title" placeholder="Savol (masalan: 1/2 + 1/4 = ?)">
                <input id="q-a" placeholder="A variant">
                <input id="q-b" placeholder="B variant">
                <input id="q-c" placeholder="C variant">
                <input id="q-d" placeholder="D variant">
                <select id="q-answer">
                    <option value="0">To'g'ri javob: A</option>
                    <option value="1">To'g'ri javob: B</option>
                    <option value="2">To'g'ri javob: C</option>
                    <option value="3">To'g'ri javob: D</option>
                </select>
                <button class="btn btn-primary" onclick="addQuiz()">Savolni qo'shish</button>
            </div>
        </div>
    </div>

    <!-- KURS SAHIFASI (MODAL) -->
    <div id="modal-course" style="position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:9998; overflow-y:auto; padding:20px;">
        <div class="card" style="max-width:760px; margin:0 auto; padding:24px;">
            <div id="course-detail"></div>
            <button class="btn btn-outline" style="margin-top:14px;" onclick="closeCourse()">⬅️ Orqaga</button>
        </div>
    </div>

    <script>
        let currentTab = 'kurslar';
        const esc = s => String(s ?? '').replace(/"/g,'&quot;').replace(/</g,'&lt;');
        const fmt = n => (+n||0).toLocaleString();
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
        const coursesArr = () => Array.isArray(window.courses) ? window.courses.filter(x=>x) : Object.values(window.courses||{}).filter(x=>x);

        function toast(msg, type='ok') {
            const t = document.createElement('div'); t.className='toast '+type; t.innerText=msg;
            document.body.appendChild(t); setTimeout(()=>t.remove(),4000);
        }
        function updateSync(){
            const el = document.getElementById('sync'); if (!el) return;
            const map = { yuklanmoqda:'☁️...', ulandi:'☁️ Bulutga ulangan', xato:'📴 Qurilmada saqlanadi' };
            el.innerText = map[window.cloudStatus] || '';
        }

        /* ---------- RO'YXATDAN O'TISH / KIRISH ---------- */
        function toggleLogin(){
            const a = document.getElementById('login-form'), b = document.getElementById('login-exist');
            a.style.display = a.style.display === 'none' ? 'block' : 'none';
            b.style.display = a.style.display === 'none' ? 'block' : 'none';
        }
        function register(){
            const name = document.getElementById('auth-name').value.trim();
            const phone = document.getElementById('auth-phone').value.replace(/[^0-9]/g,'');
            const pass = document.getElementById('auth-pass').value;
            if (!name || phone.length < 9 || pass.length < 4) return toast("Ism, to'g'ri telefon va parol (4+ belgi) kiriting!", 'warn');
            if (window.users[phone]) return toast("Bu raqam allaqachon ro'yxatdan o'tgan — «Akkauntim bor» orqali kiring!", 'err');
            window.users[phone] = { name, pass, role:'student', bought:{}, progress:{}, quizResults:{} };
            window.saveUsers();
            enterApp(phone);
            toast("Xush kelibsiz, " + name + "! 🎉");
        }
        function login(){
            const phone = document.getElementById('log-phone').value.replace(/[^0-9]/g,'');
            const pass = document.getElementById('log-pass').value;
            const u = window.users[phone];
            if (u && u.pass === pass) { enterApp(phone); toast("Qaytganingiz bilan, " + u.name + "! 👋"); }
            else toast("Telefon yoki parol xato!", 'err');
        }
        function adminLogin(){
            const u = prompt("Admin login:"); if (u===null) return;
            const p = prompt("Admin parol:"); if (p===null) return;
            if (u === window.config.adminUser && p === window.config.adminPass) {
                window.currentUser = { id:'admin', name:'Admin', role:'admin' };
                afterAuth(); toast("Admin sifatida kirdingiz ⚙️");
            } else toast("Admin login/parol xato!", 'err');
        }
        function enterApp(phone){
            const u = window.users[phone];
            window.currentUser = { id:phone, name:u.name, role:'student', data:u };
            afterAuth();
        }
        function afterAuth(){
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('main-content').style.display='block';
            sessionStorage.setItem('lmsAuth','true');
            sessionStorage.setItem('lmsPhone', window.currentUser.id);
            document.body.classList.toggle('role-admin', window.currentUser.role === 'admin');
            document.getElementById('who').innerText = window.currentUser.name;
            document.getElementById('acad-title').innerText = window.config.academyName;
            renderCurrent();
        }
        function logout(){
            sessionStorage.clear(); window.currentUser = null;
            document.body.classList.remove('role-admin');
            location.reload();
        }

        /* ---------- TABLAR ---------- */
        function switchTab(t){
            currentTab = t;
            document.querySelectorAll('.tab-page').forEach(p=>p.style.display='none');
            document.getElementById('tab-'+t).style.display='block';
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('tb-'+t).classList.add('active');
            renderCurrent();
        }
        function renderCurrent(){
            if (!window.currentUser) return;
            ({ kurslar:renderCatalog, mening:renderMy, boshqaruv:renderAdmin, ustozlar:renderTeacher })[currentTab]();
            updateSync();
        }

        /* ---------- KURSLAR KATALOGI ---------- */
        function renderCatalog(){
            const list = coursesArr();
            document.getElementById('catalog').innerHTML = list.length ? list.map(c => {
                const bought = isBought(c.id);
                return `<div class="course-card" onclick="openCourse('${c.id}')">
                    <div class="course-cover" style="background:${c.color||'#6366f1'}">${c.emoji||'📚'}</div>
                    <div class="course-body">
                        <h3>${esc(c.title)}</h3>
                        <p>${esc(c.desc||'')}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="price-tag">${+c.price>0 ? fmt(c.price)+" so'm" : 'BEPUL'}</span>
                            <span class="chip">${bought?'✅ Olindam':'👁 Ko\'rish'}</span>
                        </div>
                    </div></div>`;
            }).join('') : '<div class="chip">Hozircha kurslar yo\'q — admin kurs qo\'shishi kerak</div>';
        }
        function isBought(cid){
            if (!window.currentUser || window.currentUser.role === 'admin') return true;
            const u = window.currentUser.data;
            return u && u.bought && u.bought[cid];
        }

        /* ---------- KURS SAHIFASI ---------- */
        function openCourse(cid){
            const c = coursesArr().find(x=>x.id===cid); if (!c) return;
            const bought = isBought(cid);
            const lessons = (c.lessons||[]);
            const quizzes = (c.quizzes||[]);
            const prog = myProgress(c);

            let html = `<h2 style="margin-top:0;">${c.emoji||'📚'} ${esc(c.title)}</h2>
                <p style="color:var(--sub);">${esc(c.desc||'')}</p>
                <div class="progress-bar" style="margin-bottom:16px;"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
                <div class="chip" style="display:inline-block; margin-bottom:16px;">📊 ${prog.doneLessons}/${lessons.length} dars tugallandi (${prog.pct}%)</div>`;

            if (!bought) {
                html += `<div style="background:#fff7ed; border:1px solid #fdba74; border-radius:16px; padding:18px; margin-bottom:16px;">
                    <h3 style="margin:0 0 8px;">🔒 Bu kurs pullik</h3>
                    <p style="margin:0 0 12px;">Narx: <b>${fmt(c.price)} so'm</b></p>
                    <button class="btn btn-success" onclick="payCourse('${cid}')">💳 Sotib olish</button>
                </div>`;
            } else {
                html += `<h3>🎬 Darslar</h3>`;
                if (!lessons.length) html += '<div class="chip" style="margin-bottom:12px;">Darslar hali qo\'shilmagan</div>';
                lessons.forEach((l,i) => {
                    const done = isDone(c.id, i);
                    html += `<div class="lesson-row ${done?'done':''}">
                        <div><b>${esc(l.title)}</b>${l.desc?`<div style="font-size:12px; color:var(--sub);">${esc(l.desc)}</div>`:''}</div>
                        <button class="btn ${done?'btn-outline':'btn-primary'}" onclick="watchLesson('${cid}',${i})">${done?'✅ Qayta ko\'rish':'▶️ Ko\'rish'}</button>
                    </div>`;
                });
                if (quizzes.length) html += `<h3 style="margin-top:18px;">📝 Testlar</h3>
                    <button class="btn btn-success" onclick="startQuiz('${cid}')">🧠 Testni boshlash (${quizzes.length} savol)</button>`;
            }
            document.getElementById('course-detail').innerHTML = html;
            document.getElementById('modal-course').style.display='block';
        }
        function closeCourse(){ document.getElementById('modal-course').style.display='none'; renderCurrent(); }

        function watchLesson(cid, idx){
            const c = coursesArr().find(x=>x.id===cid); if (!c) return;
            const l = c.lessons[idx];
            // YouTube havolani iframe formatga aylantirish
            let v = l.video||'';
            let vid = '';
            const m1 = v.match(/youtu\.be\/([\w-]+)/), m2 = v.match(/youtube\.com\/watch\?v=([\w-]+)/), m3 = v.match(/embed\/([\w-]+)/);
            if (m1) vid = m1[1]; else if (m2) vid = m2[1]; else if (m3) vid = m3[1];

            let html = `<h2 style="margin-top:0;">🎬 ${esc(l.title)}</h2>`;
            if (vid) html += `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe></div>`;
            else html += '<div class="chip" style="margin-bottom:12px;">⚠️ Video havolasi noto\'g\'ri yoki yo\'q</div>';
            if (l.desc) html += `<p>${esc(l.desc)}</p>`;
            html += `<button class="btn btn-success" onclick="markDone('${cid}',${idx})">✅ Darsni tugalladim</button>
                     <button class="btn btn-outline" onclick="openCourse('${cid}')" style="margin-left:8px;">⬅️ Darslar ro'yxati</button>`;
            document.getElementById('course-detail').innerHTML = html;
        }
        function markDone(cid, idx){ if (needAuth()) return;
            const u = window.currentUser.data;
            if (!u.progress[cid]) u.progress[cid] = {};
            u.progress[cid]['l'+idx] = true;
            window.saveUsers(); toast("Dars tugallandi! ✅");
            openCourse(cid);
        }
        function isDone(cid, idx){
            const u = window.currentUser?.data; if (!u) return false;
            return u.progress?.[cid]?.['l'+idx] === true;
        }
        function myProgress(c){
            const u = window.currentUser?.data; if (!u) return {pct:0, doneLessons:0};
            const total = (c.lessons||[]).length;
            let done = 0;
            (c.lessons||[]).forEach((l,i) => { if (u.progress?.[c.id]?.['l'+i]) done++; });
            return { pct: total?Math.round(done/total*100):0, doneLessons:done };
        }

        /* ---------- TEST ---------- */
        function startQuiz(cid){
            const c = coursesArr().find(x=>x.id===cid); if (!c) return;
            window._quiz = { cid, i:0, correct:0, total:c.quizzes.length };
            showQuizQuestion();
        }
        function showQuizQuestion(){
            const q = window._quiz;
            const c = coursesArr().find(x=>x.id===q.cid);
            if (q.i >= q.total) return finishQuiz();
            const item = c.quizzes[q.i];
            const opts = ['a','b','c','d'];
            let html = `<h2 style="margin-top:0;">🧠 Test</h2>
                <div class="chip" style="display:inline-block; margin-bottom:12px;">Savol ${q.i+1} / ${q.total} | ✅ To'g'ri: ${q.correct}</div>
                <h3>${esc(item.title)}</h3>`;
            opts.forEach((k,i) => {
                if (item[k]) html += `<button class="quiz-opt" onclick="answerQuiz(${i}, this)">${esc(item[k])}</button>`;
            });
            document.getElementById('course-detail').innerHTML = html;
        }
        function answerQuiz(i, btn){
            const q = window._quiz;
            const c = coursesArr().find(x=>x.id===q.cid);
            const item = c.quizzes[q.i];
            document.querySelectorAll('.quiz-opt').forEach((b,j) => {
                b.disabled = true;
                if (j === +item.answer) b.classList.add('correct');
            });
            if (i === +item.answer) { q.correct++; btn.classList.add('correct'); }
            else btn.classList.add('wrong');
            setTimeout(() => { q.i++; showQuizQuestion(); }, 1200);
        }
        function finishQuiz(){
            const q = window._quiz;
            const c = coursesArr().find(x=>x.id===q.cid);
            const pct = Math.round(q.correct/q.total*100);
            // Natijani saqlash
            const u = window.currentUser.data;
            if (!u.quizResults) u.quizResults = {};
            u.quizResults[q.cid] = { correct:q.correct, total:q.total, pct, date:new Date().toISOString().slice(0,10) };
            window.saveUsers();
            let html = `<h2 style="margin-top:0;">🎉 Test tugadi!</h2>
                <div class="stat-grid">
                    <div class="stat-card"><span>To'g'ri javoblar</span><h2>${q.correct}/${q.total}</h2></div>
                    <div class="stat-card"><span>Natija</span><h2 style="color:${pct>=70?'var(--success)':'var(--danger)'}">${pct}%</h2></div>
                </div>`;
            if (pct >= 70) {
                html += `<p>✅ Tabriklaymiz! Kursni muvaffaqiyatli yakunladingiz. Sertifikat oling:</p>
                    <button class="btn btn-primary" onclick="makeCertificate('${q.cid}')">🏆 Sertifikat olish</button>`;
            } else {
                html += `<p>📖 Yana bir bor darslarni ko'rib chiqing va qayta topshiring! (70%+ kerak)</p>`;
            }
            html += ` <button class="btn btn-outline" onclick="openCourse('${q.cid}')">⬅️ Kursga qaytish</button>`;
            document.getElementById('course-detail').innerHTML = html;
        }

        /* ---------- SERTIFIKAT ---------- */
        function makeCertificate(cid){
            const c = coursesArr().find(x=>x.id===cid);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            const name = window.currentUser.name;
            // Fon ramka
            doc.setDrawColor(99,102,241); doc.setLineWidth(4); doc.rect(10,10,277,190);
            doc.setDrawColor(200,200,220); doc.setLineWidth(1); doc.rect(16,16,265,178);
            doc.setFontSize(30); doc.setTextColor(99,102,241);
            doc.text("SERTIFIKAT", 148.5, 45, {align:'center'});
            doc.setFontSize(11); doc.setTextColor(120);
            doc.text(window.config.academyName + " tasdiqlaydi", 148.5, 58, {align:'center'});
            doc.setFontSize(12); doc.setTextColor(60);
            doc.text("Bu sertifikat quyidagi shaxsga berildi:", 148.5, 80, {align:'center'});
            doc.setFontSize(24); doc.setTextColor(30,30,30);
            doc.text(name, 148.5, 98, {align:'center'});
            doc.setFontSize(12); doc.setTextColor(60);
            doc.text("quyidagi kursni muvaffaqiyatli yakunlagani uchun:", 148.5, 112, {align:'center'});
            doc.setFontSize(18); doc.setTextColor(99,102,241);
            doc.text(c.title, 148.5, 128, {align:'center'});
            const qr = (window.currentUser.data?.quizResults?.[cid]?.pct) || 100;
            doc.setFontSize(11); doc.setTextColor(120);
            doc.text(`Test natijasi: ${qr}% | Sana: ${new Date().toLocaleDateString('uz-UZ')} | ID: ${cid.slice(0,8).toUpperCase()}`, 148.5, 165, {align:'center'});
            doc.save('Sertifikat_' + name + '.pdf');
            toast("Sertifikat yuklab olindi! 🏆");
        }

        /* ---------- TO'LOV (hozircha qo'lda tasdiqlash) ---------- */
        function payCourse(cid){ if (needAuth()) return;
            const c = coursesArr().find(x=>x.id===cid);
            const way = prompt(`Kurs narxi: ${fmt(c.price)} so'm\n\nTo'lov qiling:\n💳 Karta: 8600 1234 5678 9012 (M XX)\n\nTo'lovni qilgach, chek raqamini kiriting:`);
            if (!way) return;
            // Hozircha qo'lda: admin keyin tasdiqlaydi. Oddiy model — darhol ochamiz (demo rejim)
            const u = window.currentUser.data;
            if (!u.bought) u.bought = {};
            u.bought[cid] = { date:new Date().toISOString().slice(0,10), check:way, price:c.price };
            window.saveUsers();
            toast("To'lov qayd etildi! Kurs ochildi ✅");
            openCourse(cid);
        }

        /* ---------- ADMIN: KURSLAR ---------- */
        function renderAdmin(){
            const list = coursesArr();
            document.getElementById('st-courses').innerText = list.length;
            document.getElementById('st-users').innerText = Object.keys(window.users||{}).length;
            let rev = 0;
            Object.values(window.users||{}).forEach(u => Object.values(u.bought||{}).forEach(b => rev += +b.price||0));
            document.getElementById('st-revenue').innerText = fmt(rev);

            document.getElementById('conf-name').value = window.config.academyName || '';
            renderTeacherSelects();
        }
        function addCourse(){
            const title = document.getElementById('c-title').value.trim();
            if (!title) return toast("Kurs nomini kiriting!", 'warn');
            if (!Array.isArray(window.courses)) window.courses = [];
            window.courses.push({
                id: uid(),
                title, desc: document.getElementById('c-desc').value.trim(),
                price: +document.getElementById('c-price').value || 0,
                emoji: document.getElementById('c-emoji').value.trim() || '📚',
                color: document.getElementById('c-color').value,
                lessons: [], quizzes: []
            });
            window.saveCourses(); renderAdmin(); renderCatalog();
            document.getElementById('c-title').value=''; document.getElementById('c-desc').value='';
            toast("Kurs qo'shildi ✅ Endi «👨‍🏫 Ustozlar paneli»da dars qo'shing");
        }
        function saveConf(){
            window.config.academyName = document.getElementById('conf-name').value.trim() || 'Onlayn Akademiya';
            window.saveConfigLMS();
            document.getElementById('acad-title').innerText = window.config.academyName;
            toast("Saqlandi ✅");
        }

        /* ---------- USTOZ: DARSLAR VA TESTLAR ---------- */
        function renderTeacher(){
            renderTeacherSelects();
        }
        function renderTeacherSelects(){
            const list = coursesArr();
            const opts = list.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('') || '<option value="">Avval kurs qo\'shing</option>';
            const lc = document.getElementById('lesson-course'), qc = document.getElementById('quiz-course');
            if (lc) lc.innerHTML = opts;
            if (qc) qc.innerHTML = opts;
        }
        function addLesson(){
            const cid = document.getElementById('lesson-course').value;
            const title = document.getElementById('l-title').value.trim();
            const video = document.getElementById('l-video').value.trim();
            if (!cid) return toast("Avval kurs qo'shing!", 'warn');
            if (!title || !video) return toast("Dars nomi va YouTube havolasini kiriting!", 'warn');
            const c = coursesArr().find(x=>x.id===cid); if (!c) return;
            if (!c.lessons) c.lessons = [];
            c.lessons.push({ title, video, desc: document.getElementById('l-desc').value.trim() });
            window.saveCourses();
            document.getElementById('l-title').value=''; document.getElementById('l-video').value=''; document.getElementById('l-desc').value='';
            toast("Dars qo'shildi ✅");
        }
        function addQuiz(){
            const cid = document.getElementById('quiz-course').value;
            const title = document.getElementById('q-title').value.trim();
            if (!cid) return toast("Avval kurs qo'shing!", 'warn');
            if (!title) return toast("Savolni kiriting!", 'warn');
            const c = coursesArr().find(x=>x.id===cid); if (!c) return;
            if (!c.quizzes) c.quizzes = [];
            c.quizzes.push({
                title,
                a: document.getElementById('q-a').value.trim(),
                b: document.getElementById('q-b').value.trim(),
                c: document.getElementById('q-c').value.trim(),
                d: document.getElementById('q-d').value.trim(),
                answer: document.getElementById('q-answer').value
            });
            window.saveCourses();
            ['q-title','q-a','q-b','q-c','q-d'].forEach(id=>document.getElementById(id).value='');
            toast("Savol qo'shildi ✅");
        }

        /* ---------- MENING KURSLARIM ---------- */
        function renderMy(){
            const u = window.currentUser?.data;
            const el = document.getElementById('my-courses');
            if (!u || !u.bought || !Object.keys(u.bought).length) {
                el.innerHTML = '<div class="chip">Sizda hali kurs yo\'q — «📚 Kurslar» bo\'limidan tanlang!</div>';
                return;
            }
            const list = coursesArr().filter(c => u.bought[c.id]);
            el.innerHTML = list.map(c => {
                const prog = myProgress(c);
                const qr = u.quizResults?.[c.id];
                return `<div class="course-card" onclick="openCourse('${c.id}')">
                    <div class="course-cover" style="background:${c.color||'#6366f1'}">${c.emoji||'📚'}</div>
                    <div class="course-body">
                        <h3>${esc(c.title)}</h3>
                        <div class="progress-bar" style="margin:8px 0;"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
                        <p>📊 ${prog.pct}% tugallandi ${qr?` | 🧠 Test: ${qr.pct}%`:''}</p>
                    </div></div>`;
            }).join('');
        }

        /* ---------- BOSHQA ---------- */
        function needAuth(){ if (!window.currentUser) { toast("Avval ro'yxatdan o'ting!", 'warn'); return true; } return false; }
        function toggleDark(){
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('lmsDark', document.body.classList.contains('dark-mode')?'1':'0');
            document.getElementById('dark-toggle').innerText = document.body.classList.contains('dark-mode')?'☀️':'🌙';
        }
        if (localStorage.getItem('lmsDark')==='1'){
            document.body.classList.add('dark-mode');
            document.getElementById('dark-toggle').innerText='☀️';
        }
        document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeCourse(); });

        // Sessiyada qayta kirish
        if (sessionStorage.getItem('lmsAuth')==='true' && sessionStorage.getItem('lmsPhone')) {
            const ph = sessionStorage.getItem('lmsPhone');
            setTimeout(() => {
                const u = window.users[ph];
                if (u) { window.currentUser = { id:ph, name:u.name, role:'student', data:u }; afterAuth(); }
                else if (ph === 'admin') { window.currentUser = { id:'admin', name:'Admin', role:'admin' }; afterAuth(); }
            }, 800);
        }
    </script>
</body>
</html>
