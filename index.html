        { q: "128. Farg'onada qo'g'irchoq teatri qachon ochilgan?", a: ["1991", "1992", "1993", "1994"], c: 2 },
        { q: "129. O'zbekistonda teleradio nechta tilda efirga uzatiladi?", a: ["8", "10", "12", "15"], c: 2 },
        { q: "130. 'Baynalmilal' so'zi qaysi tildan olingan?", a: ["Forscha", "Arabcha", "Ruscha", "Turkiy"], c: 1 },
        { q: "131. 1989-yilda o'zbek tiliga qanday maqom berilgan?", a: ["Xalqaro", "Davlat tili", "Milliy", "Diniy"], c: 1 },
        { q: "132. O'zbekistonning mustaqillik kuni?", a: ["21-oktabr", "1-sentabr", "8-dekabr", "2-iyul"], c: 1 },
        { q: "133. Konstitutsiyaning nechanchi moddasida saylov huquqi bor?", a: ["117", "90", "32", "55"], c: 0 }
    ];
    let current = 0; let score = 0;
    function render() {
        const q = data[current];
        document.getElementById("q-num").innerText = `SAVOL ${current + 1}/${data.length}`;
        document.getElementById("question-text").innerText = q.q;
        document.getElementById("bar").style.width = `${((current) / data.length) * 100}%`;
        const list = document.getElementById("options-list");
        list.innerHTML = ""; 
        q.a.forEach((opt, i) => {
            const div = document.createElement("div");
            div.className = "option";
            div.innerText = opt;
            div.onclick = () => handleSelect(i, div);
            list.appendChild(div);
        });
    }
    function handleSelect(idx, el) {
        const correct = data[current].c;
        const all = document.querySelectorAll('.option');
        all.forEach(o => o.style.pointerEvents = 'none');
        if(idx === correct) { score++; el.classList.add("correct"); }
        else { el.classList.add("wrong"); all[correct].classList.add("correct"); }
        setTimeout(() => {
            current++;
            if(current < data.length) render();
            else showResult();
        }, 1000);
    }
    function showResult() {
        document.getElementById("quiz-ui").style.display = "none";
        document.getElementById("bar").style.width = "100%";
        document.getElementById("result-ui").style.display = "block";
        document.getElementById("final-score").innerText = `${score}/${data.length}`;
        document.getElementById("feedback").innerText = score > (data.length / 2) ? "ZUKKO BILIMDON!" : "YANA O'QING!";
    }
    render();
</script>
</body>
</html>
